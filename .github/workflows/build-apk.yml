# Builds a debug APK of Kali Vivo Terminal with Buildozer on ubuntu-latest.
# The APK is uploaded as a workflow artifact named "kali-vivo-terminal-debug-apk".
name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build debug APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 (required by Android build tools)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            m4 texinfo gettext autopoint \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            build-essential cmake
      - name: Stage assets into app source
        # Buildozer packages only src/. Copy assets/ into src/assets/ so the
        # fonts and icons are included in the APK.
        run: |
          mkdir -p src/assets
          cp -a assets/. src/assets/

      - name: Restore Buildozer cache (SDK, NDK, and build state)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          # Cython 0.29.x is the version Kivy 2.3 builds reliably against.
          python -m pip install --upgrade buildozer "cython==0.29.37"

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Locate built APK
        id: find_apk
        run: |
          APK=$(find bin -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found in bin/" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Built: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kali-vivo-terminal-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
